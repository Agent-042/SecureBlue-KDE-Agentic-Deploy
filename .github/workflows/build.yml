name: Build SecureBlue-KDE-Agentic-Deploy Images

on:
  schedule:
    # Rebuild weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.assets/docs/**'
      - '.backend/swarm_ledger.json'
      - 'push-live-status.sh'
      - '.backend/scripts/legacy/**'
      - '.github/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Push ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - recipe.yml
          - recipe-amd-workstation.yml
          - recipe-intel-g16.yml
    env:
      # The cosign-generated signing key in COSIGN_PRIVATE_KEY has no password.
      COSIGN_PASSWORD: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and push image
        uses: blue-build/github-action@v1
        env:
          MACOS_ICONS_API_KEY: ${{ secrets.MACOS_ICONS_API_KEY }}
        with:
          recipe: ${{ matrix.recipe }}
          recipe_dir: .backend/recipes
          registry_token: ${{ github.token }}
          cosign_private_key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          pr_event_number: ${{ github.event.number }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign Container Image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_NAME=$(grep '^name:' .backend/recipes/${{ matrix.recipe }} | awk '{print $2}')
          REGISTRY="ghcr.io"
          NAMESPACE=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY ${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}:latest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
