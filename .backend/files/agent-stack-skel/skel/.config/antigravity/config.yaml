# Antigravity configuration template for SecureBlue KDE Agentic Deploy.
#
# Ollama is baked into the image as a system binary and started by ollama.service on
# http://127.0.0.1:11434. This endpoint is localhost-only, so it is
# agnostic to the username / home directory path.
provider: ollama
ollama:
  base_url: http://127.0.0.1:11434
  model: qwen2.5-coder:7b-instruct-q4_K_M
  temperature: 0.2
  max_tokens: 4096
