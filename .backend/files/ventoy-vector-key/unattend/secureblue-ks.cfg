# SecureBlue / Bazzite Automated Unattended Kickstart
# Target: ASUS ROG Zephyrus G16 & AMD 7800X3D Workstation nodes
# Mode: Non-interactive / Offline / Verbose Boot Logging

# System Authorization
auth --enableshadow --passalgo=sha512
keyboard --vckeymap=us --xlayouts='us'
lang en_US.UTF-8
timezone UTC --isUtc

# Reboot after installation completes
reboot --eject

# Root and Admin User Account Setup
rootpw --plaintext "SecureBlue2026!"
user --name=admin --groups=wheel --plaintext --password="SecureBlue2026!" --gecos="System Administrator"

# Network Configuration
network --bootproto=dhcp --device=link --activate --onboot=yes --hostname=secureblue-workstation

# Disk Partitioning & Wiping (Zero-Touch Btrfs Layout)
zerombr
clearpart --all --initlabel
part /boot/efi --fstype="vfat" --size=600 --fsoptions="umask=0077,shortname=winnt"
part /boot --fstype="ext4" --size=2048
part btrfs.01 --size=1 --grow

btrfs none --label=fedora btrfs.01
btrfs / --subvol --name=root fedora
btrfs /home --subvol --name=home fedora
btrfs /var --subvol --name=var fedora

# Package Selection
%packages
@core
@kde-desktop
kmod-nvidia
easyeffects
pipewire
podman
btrfs-progs
%end

# Post-Installation Kernel Argument Adjustments & SecureBoot Injection
%post --erroronfail
echo "[POST-INSTALL] Adjusting GRUB kernel arguments..."

# Disable quiet and splash; enforce loglevel=7 for verbose error diagnosis
sed -i 's/GRUB_CMDLINE_LINUX="\(.*\)"/GRUB_CMDLINE_LINUX="\1 amd_iommu=on iommu=pt loglevel=7 systemd.log_level=debug"/g' /etc/default/grub
sed -i 's/quiet//g' /etc/default/grub
sed -i 's/rhgb//g' /etc/default/grub
sed -i 's/splash//g' /etc/default/grub

# Rebuild GRUB configuration
if [ -d /sys/firmware/efi ]; then
    grub2-mkconfig -o /boot/efi/EFI/fedora/grub.cfg || grub2-mkconfig -o /boot/grub2/grub.cfg
else
    grub2-mkconfig -o /boot/grub2/grub.cfg
fi

# Inject run0 polkit permissions for admin
mkdir -p /etc/polkit-1/rules.d/
cat << 'EOF' > /etc/polkit-1/rules.d/50-run0-admin.rules
polkit.addRule(function(action, subject) {
    if (action.id == "org.freedesktop.systemd1.bus.manage-units" && subject.isInGroup("wheel")) {
        return polkit.Result.YES;
    }
});
EOF

echo "[POST-INSTALL] Unattended installation configuration complete!"
%end
