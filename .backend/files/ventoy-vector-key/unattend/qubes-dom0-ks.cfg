# Qubes OS Dom0 Automated Kickstart & G16 SecureBoot Injection
# Target: G16 Zephyrus / AMD Workstation Dom0 SecureBoot Execution

auth --enableshadow --passalgo=sha512
keyboard --vckeymap=us --xlayouts='us'
lang en_US.UTF-8
timezone UTC

reboot --eject

rootpw --plaintext "QubesDom02026!"
user --name=dom0admin --groups=wheel --plaintext --password="QubesDom02026!" --gecos="Dom0 Admin"

network --bootproto=dhcp --device=link --activate --onboot=yes --hostname=qubes-dom0

zerombr
clearpart --all --initlabel
part /boot/efi --fstype="vfat" --size=600
part /boot --fstype="ext4" --size=2048
part pv.01 --size=1 --grow
volgroup qubes_dom0 pv.01
logvol / --fstype="ext4" --name=root --vgname=qubes_dom0 --size=40960
logvol swap --fstype="swap" --name=swap --vgname=qubes_dom0 --size=16384
logvol /var/lib/qubes --fstype="ext4" --name=qubes_pool --vgname=qubes_dom0 --size=1 --grow

%packages
@qubes-dom0
xen
%end

%post
echo "[QUBES-DOM0] Injecting G16 SecureBoot variables and verbosity into Xen/GRUB..."

# Strip quiet/rhgb and enforce loglevel=7 in Xen EFI boot configuration
if [ -f /boot/efi/EFI/qubes/xen.cfg ]; then
    sed -i 's/quiet//g' /boot/efi/EFI/qubes/xen.cfg
    sed -i 's/rhgb//g' /boot/efi/EFI/qubes/xen.cfg
    echo "options=console=vga loglvl=all guest_loglvl=all" >> /boot/efi/EFI/qubes/xen.cfg
fi

# Set GRUB verbosity
sed -i 's/quiet//g' /etc/default/grub
sed -i 's/rhgb//g' /etc/default/grub
echo 'GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX loglevel=7 systemd.log_level=debug"' >> /etc/default/grub
grub2-mkconfig -o /boot/efi/EFI/qubes/grub.cfg 2>/dev/null || true

echo "[QUBES-DOM0] SecureBoot injection and Kickstart setup complete!"
%end
