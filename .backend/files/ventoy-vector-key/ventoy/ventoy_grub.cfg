# Ventoy Custom Fleet Recovery & Deployment GRUB Submenu Extension
# Press F6 in Ventoy main menu to access this custom submenu
# NOTE: All silent boot flags stripped. Verbose logging (loglevel=7) strictly enforced across 100% of entries.

menuentry "⚡ Automated SecureBlue KDE Deployment (Unattended Kickstart)" --class fedora {
    echo "Booting SecureBlue ISO with Unattended Kickstart..."
    set iso_path="/ISO/SecureBlue-KDE-offline.iso"
    loopback loop $iso_path
    linux (loop)/images/pxeboot/vmlinuz inst.ks=hd:LABEL=VENTOY:/unattend/secureblue-ks.cfg loglevel=7 systemd.log_level=debug
    initrd (loop)/images/pxeboot/initrd.img
}

menuentry "🎮 Bazzite Linux Live / Install (VFIO Staging Mode)" --class bazzite {
    echo "Booting Bazzite Nvidia ISO with VFIO Passthrough Staging..."
    set iso_path="/ISO/Bazzite-Nvidia.iso"
    loopback loop $iso_path
    linux (loop)/images/pxeboot/vmlinuz inst.ks=hd:LABEL=VENTOY:/unattend/secureblue-ks.cfg amd_iommu=on iommu=pt loglevel=7 systemd.log_level=debug
    initrd (loop)/images/pxeboot/initrd.img
}

menuentry "🪟 Windows 11 Enterprise (Unattended Installation)" --class windows {
    echo "Booting Windows 11 ISO with Unattend Answer File..."
    set iso_path="/ISO/Windows11-enterprise.iso"
    loopback loop $iso_path
    chainloader (loop)/bootmgr
}

menuentry "🧊 Qubes OS Dom0 Deployment (G16 SecureBoot Injection)" --class qubes {
    echo "Booting Qubes OS ISO with G16 SecureBoot Dom0 Injection..."
    set iso_path="/ISO/Qubes-OS.iso"
    loopback loop $iso_path
    linux (loop)/isolinux/mboot.c32 (loop)/isolinux/xen.gz --- (loop)/isolinux/vmlinuz inst.ks=hd:LABEL=VENTOY:/unattend/qubes-dom0-ks.cfg loglevel=7 systemd.log_level=debug --- (loop)/isolinux/initrd.img
}

menuentry "🔍 System Diagnostics & Zero-Touch Log Extractor" --class diagnostic {
    echo "Executing Zero-Touch Hardware Diagnostic & Error Log Harvester..."
    linux /rescue-engine/bin/harvester.sh loglevel=7 systemd.log_level=debug
}

menuentry "🤖 Launch Offline AI Diagnostic Assistant (Qwen2.5 + uBlue RAG)" --class ai {
    echo "Spinning up Offline Qwen2.5-7B RAG Rescue Assistant..."
    python3 /rescue-engine/bin/rag_assistant.py --docs /rescue-engine/docs-rag --models /rescue-engine/models
}
